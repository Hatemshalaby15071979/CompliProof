# gitleaks configuration — CompliProof
#
# Owner-verified 2026-11-13: every finding in this repository is a synthetic
# test fixture, not a credential. All of them live in the vendored
# `helix-prime/tests/` suite and are the same placeholders used by Helix-Codex
# and Helix-Prime. See audit-11-13/SECRET_SCAN_RESULTS.md for the evidence.
#
# `useDefault = true` is required: supplying a config otherwise REPLACES the
# built-in rule set, so no rules would run at all (a silent false negative).

[extend]
useDefault = true

[[allowlists]]
description = "Placeholder API keys in the helix-prime secret-redaction tests (not live keys)"
# Anchored: `sk-1234567890` is a prefix of `sk-1234567890abcdef`, so both
# entries are needed and both must match the whole secret.
regexes = [
  '''^sk-1234567890abcdef$''',
  '''^sk-1234567890$''',
]

[[allowlists]]
description = "Source-code identifier matched as if it were a value (gitleaks generic-api-key keyword match)"
regexes = ['''^wf2\.idempotency_key$''']

[[allowlists]]
description = "Python bytecode cache (gitignored build artifact) holding the synthetic AWS key from the scanner self-test"
# The .pyc is generated by running the test suite and is not tracked. Its
# compiled strings contain the same synthetic AWS-shaped placeholder the test
# writes into a throw-away repository; scanning it adds noise only.
paths = ['''__pycache__/''']
