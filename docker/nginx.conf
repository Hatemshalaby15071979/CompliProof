# Reference TLS-terminating reverse proxy for CompliProof (single instance).
# Terminate TLS here and forward to the container on 127.0.0.1:8200.
# Set COMPLIPROOF_SECURE_COOKIES=1 on the app container.

server {
    listen 443 ssl http2;
    server_name compliproof.example.com;

    ssl_certificate     /etc/ssl/certs/compliproof.crt;
    ssl_certificate_key /etc/ssl/private/compliproof.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 6m;

    # Security headers. Without these the dashboard and report downloads are
    # frame-able, sniff-able, and cacheable over a downgraded connection.
    # CSP is strict on purpose: the app is server-rendered and same-origin.
    # If a future screen needs inline style, add a nonce; do not add
    # 'unsafe-inline' back for the whole site.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass         http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name compliproof.example.com;
    # HSTS on the redirect too: a client that reaches :80 first must not be
    # able to be downgraded on the next request.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://$host$request_uri;
}
