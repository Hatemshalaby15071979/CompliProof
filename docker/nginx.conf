# Reference TLS-terminating reverse proxy for CompliProof (single instance).
# Terminate TLS here and forward to the container on 127.0.0.1:8200.
# Set COMPLIPROOF_SECURE_COOKIES=1 on the app container.

server {
    listen 443 ssl http2;
    server_name compliproof.example.com;

    ssl_certificate     /etc/ssl/certs/compliproof.crt;
    ssl_certificate_key /etc/ssl/private/compliproof.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 6m;

    location / {
        proxy_pass         http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name compliproof.example.com;
    return 301 https://$host$request_uri;
}
