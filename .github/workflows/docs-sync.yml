name: docs-sync

# Branch policy: default branch is `audit/shipment-candidate` (not `main`/`master`).
# This workflow runs only on a published release and opens a PR — it never commits
# straight to the default branch. Note: git history is not rewritten here; that
# requires the owner's explicit G2 authorization.
#
# Keep the visitor-facing status block (version, release date, tests, coverage,
# CI) in README.md / index.html current the moment a release ships. Trigger is
# release-only — a plain push never touches the docs. Opens a PR for review;
# never commits straight to the default branch.
on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync docs status block
        uses: Hatemshalaby15071979/Hatemshalaby15071979/.github/actions/docs-sync@master
        with:
          profile: _docs_profile.json
