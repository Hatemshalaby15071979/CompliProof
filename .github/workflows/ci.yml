name: CI

# Branch policy: this repository's default branch is `audit/shipment-candidate`
# (a non-standard name, not `main` or `master`). CI runs on push and
# pull_request to ALL branches. This is a verification gate only — a green run
# is not a release or shipment decision. Note: git history is NOT rewritten here;
# changing history requires the owner's explicit G2 authorization. Commit
# messages that assert "[gate: ... pass]" are not evidence; only this workflow's
# output is.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: 1

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          pip install setuptools==78.1.1 wheel==0.46.3 build==1.2.2.post1 pytest==9.1.1

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Verify wheel is non-empty
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")
          if not whl:
            print("FAIL: no wheel produced"); sys.exit(1)
          z = zipfile.ZipFile(whl[0])
          mods = [n for n in z.namelist() if n.startswith("compliproof/") and n.endswith(".py")]
          print(f"Wheel {whl[0]} contains {len(mods)} compliproof modules:")
          for m in sorted(mods):
            print("  ", m)
          if not mods:
            print("FAIL: wheel contains no compliproof modules"); sys.exit(1)
          PY

  install:
    name: Clean-venv install + CLI smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: pip install setuptools==78.1.1 wheel==0.46.3 build==1.2.2.post1

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Install into clean venv
        run: |
          python -m venv /tmp/cp-venv
          /tmp/cp-venv/bin/pip install --require-hashes -r requirements.lock.txt
          /tmp/cp-venv/bin/pip install --no-deps dist/*.whl
          COMPLIPROOF_WORKSPACE=/tmp/cp-workspace /tmp/cp-venv/bin/python -c \
            "from compliproof.server import DASHBOARD; assert DASHBOARD.is_file(), DASHBOARD"

      - name: CLI smoke test
        run: |
          /tmp/cp-venv/bin/compliproof --help
          /tmp/cp-venv/bin/compliproof-server --help

      - name: Generate runtime SBOM
        run: |
          python -m venv /tmp/cp-sbom-tools
          /tmp/cp-sbom-tools/bin/pip install cyclonedx-bom==7.6.0
          /tmp/cp-sbom-tools/bin/cyclonedx-py environment /tmp/cp-venv \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-file /tmp/compliproof-runtime.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          bom = json.loads(Path("/tmp/compliproof-runtime.cdx.json").read_text())
          names = {item["name"].lower() for item in bom.get("components", [])}
          root = bom.get("metadata", {}).get("component", {})
          if root.get("name"):
            names.add(root["name"].lower())
          required = {"compliproof", "reportlab", "pillow", "charset-normalizer"}
          missing = required - names
          if missing:
            raise SystemExit(f"SBOM is missing runtime components: {sorted(missing)}")
          print(f"Runtime SBOM contains {len(names)} components")
          PY

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: compliproof:local

      - name: Verify image starts (loopback only)
        run: |
          cid=$(docker run -d -p 127.0.0.1:8200:8200 compliproof:local)
          trap 'docker rm -f "$cid" >/dev/null 2>&1' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8200"
          for attempt in range(30):
              try:
                  status = urllib.request.urlopen(base + "/api/healthz", timeout=2)
                  assert status.status == 200
                  page = urllib.request.urlopen(base + "/", timeout=2).read().decode()
                  assert "CompliProof" in page
                  print("Container health and dashboard reachable on host loopback")
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Run bandit on source
        run: bandit -r src -q

      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock.txt

      - name: Secret scan (pattern check)
        run: |
          if grep -rniE "(sk_live_[A-Za-z0-9]{16,}|sk_test_[A-Za-z0-9]{16,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|xox[baprs]-[A-Za-z0-9-]{10,}|service_role[=:[:space:]]+eyJ[A-Za-z0-9._-]{20,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" src tests dashboard --exclude-dir=__pycache__; then
            echo "FAIL: potential secret found"; exit 1
          else
            echo "No hardcoded secrets detected"
          fi

  docs-consistency:
    name: Version and status consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version, Python floor and status claims
        run: python3 scripts/check_doc_consistency.py

  history-scan:
    name: History secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan every reachable commit
        run: python3 tooling/security/scan_history_secrets.py --json history-secret-scan.json

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-scan
          path: history-secret-scan.json

  gate:
    name: Release gate
    needs: [test, install, docker, security, docs-consistency, history-scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI stages green — CI workflow passed"
        if: always() && needs.test.result == 'success' && needs.install.result == 'success' && needs.docker.result == 'success' && needs.security.result == 'success' && needs.docs-consistency.result == 'success' && needs.history-scan.result == 'success'
